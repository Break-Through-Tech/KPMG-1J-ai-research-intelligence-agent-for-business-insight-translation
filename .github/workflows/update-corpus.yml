# pulls new arXiv cs.AI papers, preprocesses, chunks and indexes them, and publishes the dataset
# and search index as a GitHub release
# teammates read the newest data straight from the "latest" release, no accounts or setup needed:
#   pd.read_parquet("https://github.com/<org>/<repo>/releases/latest/download/papers_clean.parquet")
#   gh release download --pattern index.tar.gz --dir data && tar -xzf data/index.tar.gz -C data
# only this workflow publishes data, so there is always exactly one up to date copy
#
# how we know it works:
#   - every run shows a green check or red X on the Actions tab, and GitHub emails whoever set up the schedule when a run fails
#   - every release's notes say how many papers were added, the total, the date range and any backlog
#   - the last step asks arXiv for its own list of papers in the window and fails the run if we're missing any

name: Update arXiv corpus

on:
  schedule:
    # 12:00 AM Eastern on Mon/Wed/Fri. GitHub cron is in UTC:
    # "0 4" while daylight saving time is on (until Nov 1 2026), change to "0 5" after DST ends
    - cron: "0 4 * * 1,3,5"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab
    inputs:
      max_papers:
        description: "Max new papers to process this run (try 20 for a quick test). The rest wait for the next run."
        default: "1000"
      first_run_days:
        description: "Days to look back if no dataset has been published yet"
        default: "7"

permissions:
  contents: write      # needed to create releases, uses GitHub's built-in token so no secrets are required

concurrency:
  group: update-corpus # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHON: python
      PYTHONUNBUFFERED: "1"
      MAX_PAPERS: ${{ inputs.max_papers || '1000' }}
      FIRST_RUN_DAYS: ${{ inputs.first_run_days || '7' }}
      RUN_CHECK: "false"   # the coverage check runs as the last step instead, after publishing

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the embedding model
        # the tests and the indexing step both load it, so it's downloaded once and reused across runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-en-v1.5

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Download the latest published dataset
        id: download
        run: |
          mkdir -p data
          # the first run has no release yet, the update script then starts from the last few days
          gh release download --repo "${{ github.repository }}" --dir data \
            --pattern papers.parquet --pattern papers_clean.parquet --pattern preprocess_report.json \
            || echo "no published dataset yet, starting fresh"
          # the search index travels as one archive; only new papers get embedded on top of it
          gh release download --repo "${{ github.repository }}" --dir data --pattern index.tar.gz \
            || echo "no published index yet, the indexing step builds one from scratch"
          if [ -f data/index.tar.gz ]; then tar -xzf data/index.tar.gz -C data; fi
          echo "before=$(python -c "import os, pandas as pd; print(len(pd.read_parquet('data/papers.parquet')) if os.path.exists('data/papers.parquet') else 0)")" >> "$GITHUB_OUTPUT"

      - name: Pull new papers
        id: update
        # stop ingesting with time to spare, so the steps below still publish everything saved so far
        timeout-minutes: 270
        run: ./scripts/pull_recent_papers.sh --delete-pdfs

      - name: Preprocess whatever was saved
        # runs even if the step above failed or timed out partway, since its batches were already saved
        if: ${{ !cancelled() }}
        id: count
        run: |
          if [ ! -f data/papers.parquet ]; then echo "added=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m src.preprocessing.cli
          AFTER=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/papers.parquet')))")
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "added=$((AFTER - ${{ steps.download.outputs.before }}))" >> "$GITHUB_OUTPUT"

      - name: Chunk and index new papers
        # chunk_input and chunks are rebuilt from papers_clean every run (seconds), but the index
        # only embeds papers that are new or have a newer version, so the rest is reused.
        # if this fails, the publish step below still runs and re-publishes the previous index
        if: ${{ !cancelled() && steps.count.outputs.added != '0' && steps.count.outputs.added != '' }}
        id: index
        timeout-minutes: 45
        run: |
          python -m src.preprocessing.prepare_for_chunking
          python -m src.chunking.cli
          python -m src.indexing.cli
          # smoke test: the updated index loads and answers a query
          python -m src.indexing.cli --search "large language model agents" --k 3
          tar -czf data/index.tar.gz -C data index

      - name: Publish a new data release
        if: ${{ !cancelled() && steps.count.outputs.added != '0' && steps.count.outputs.added != '' }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d-%H%M)"
          python - <<'EOF' > notes.md
          import json
          r = json.load(open("data/preprocess_report.json"))
          print(f"Added **${{ steps.count.outputs.added }}** new papers, **{r['papers_out']}** total "
                f"({r['usable_papers']} usable), published {r['date_range'][0]} to {r['date_range'][1]}.")
          backlog = "${{ steps.update.outputs.backlog }}"
          if backlog and backlog != "0":
              print(f"\n**Backlog:** {backlog} more papers will be picked up by the next run.")
          if "${{ steps.update.outcome }}" != "success":
              print("\n**Note:** the ingest step stopped early (${{ steps.update.outcome }}); everything saved before that is included, the next run continues from here.")
          if "${{ steps.index.outcome }}" == "success":
              m = json.load(open("data/index/index_manifest.json"))
              print(f"\n**Search index:** {m['n_chunks']:,} chunks from {m['n_papers']:,} papers "
                    f"({m['date_range'][0]} to {m['date_range'][1]}), model `{m['model_name']}`.")
          else:
              print("\n**Note:** the index wasn't updated this run (${{ steps.index.outcome }}); "
                    "the previous index is re-published if there was one, and the next run catches up.")
          print()
          print("- `papers_clean.parquet`: cleaned text, sections and quality flags (use this one)")
          print("- `papers.parquet`: raw ingestion output, used by the next update run")
          print("- `preprocess_report.json`: corpus summary")
          print("- `index.tar.gz`: LanceDB search index, unpack into `data/` and use `src/indexing` to search it")
          print("- `chunk_report.json`: chunking summary")
          EOF
          ASSETS=(data/papers_clean.parquet data/papers.parquet data/preprocess_report.json)
          # index.tar.gz is the new index, or the downloaded previous one if indexing failed
          for f in data/index.tar.gz data/chunk_report.json; do
            if [ -f "$f" ]; then ASSETS+=("$f"); fi
          done
          # GitHub's API occasionally returns 500s, so retry, removing any half-created release first
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" "${ASSETS[@]}" \
                --repo "${{ github.repository }}" \
                --title "Corpus $(date -u +%Y-%m-%d)" \
                --notes-file notes.md \
                --latest; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then echo "publishing failed 4 times" >&2; exit 1; fi
            WAIT=$((30 * 2 ** (attempt - 1)))
            echo "publishing failed (attempt $attempt/4), retrying in ${WAIT}s"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            sleep "$WAIT"
          done

      - name: Nothing new
        if: ${{ !cancelled() && steps.count.outputs.added == '0' }}
        run: echo "no new papers since the last release, nothing published"

      - name: Check we didn't miss any papers
        # compares against arXiv's own list for the window this run covered, fails the run (and emails) if anything is missing
        if: ${{ !cancelled() && steps.update.outputs.since != '' }}
        run: python -m src.ingestion.check_coverage --since "${{ steps.update.outputs.since }}" --strict
